                      } else if (mode.equals("calldlg")) {
                          AccessibilityNodeInfo f = pickOption(root);
                          if (f == null) {
                              List<AccessibilityWindowInfo> ws = getWindows();
                              if (ws != null) {
                                  for (AccessibilityWindowInfo w : ws) {
                                      AccessibilityNodeInfo r2 = w.getRoot();
                                      if (r2 == null) continue;
                                      f = pickOption(r2);
                                      if (f != null) break;
                                  }
                              }
                          }
                          if (f != null && click(f)) {
                              dlgClicks++;
                              if (dlgClicks == 1) sayVoice(1800);
                              if (dlgClicks >= 2) pending = "";
                          } else if (f == null) {
                              dump = collect(root);
                          }
                      }
                  } catch (Exception ex) {
                  }
              }

              AccessibilityNodeInfo pickOption(AccessibilityNodeInfo r) {
                  AccessibilityNodeInfo f = find(r, CALL_TXT, true);
                  if (f == null) f = find(r, CALL_DESC, false);
                  return f;
              }

              boolean tap(AccessibilityNodeInfo root, String id, String[] words, boolean byText) {
                  if (id != null) {
                      List<AccessibilityNodeInfo> l = root.findAccessibilityNodeInfosByViewId(id);
                      if (l != null) {
                          for (AccessibilityNodeInfo n : l) { if (click(n)) return true; }
                      }
                  }
                  AccessibilityNodeInfo f = find(root, words, byText);
                  return f != null && click(f);
              }

              AccessibilityNodeInfo find(AccessibilityNodeInfo n, String[] words, boolean byText) {
                  if (n == null) return null;
                  CharSequence c = byText ? n.getText() : n.getContentDescription();
                  if (c != null) {
                      String s = c.toString().trim();
                      for (String w : words) { if (s.equalsIgnoreCase(w)) return n; }
                  }
                  for (int i = 0; i < n.getChildCount(); i++) {
                      AccessibilityNodeInfo r = find(n.getChild(i), words, byText);
                      if (r != null) return r;
                  }
                  return null;
              }

              AccessibilityNodeInfo findCall(AccessibilityNodeInfo n) {
                  if (n == null) return null;
                  CharSequence c = n.getContentDescription();
                  if (c != null && c.length() < 30) {
                      String s = c.toString().toLowerCase().trim();
                      if (s.contains("call") && !s.contains("video") && !s.contains("missed") && !s.contains("end") && !s.contains("link")) return n;
                  }
                  for (int i = 0; i < n.getChildCount(); i++) {
                      AccessibilityNodeInfo r = findCall(n.getChild(i));
                      if (r != null) return r;
                  }
                  return null;
              }

              String collect(AccessibilityNodeInfo r) {
                  StringBuilder b = new StringBuilder();
                  walk(r, b, new int[]{0});
                  return b.toString();
              }

              void walk(AccessibilityNodeInfo n, StringBuilder b, int[] cnt) {
                  if (n == null || cnt[0] >= 14) return;
                  CharSequence c = n.getContentDescription();
                  if (c == null || c.length() == 0) c = n.getText();
                  if (c != null && c.length() > 0 && c.length() < 40) {
                      if (cnt[0] > 0) b.append(", ");
                      b.append(c);
                      cnt[0]++;
                  }
                  for (int i = 0; i < n.getChildCount(); i++) walk(n.getChild(i), b, cnt);
              }

              boolean click(AccessibilityNodeInfo n) {
                  AccessibilityNodeInfo x = n;
                  while (x != null) {
                      if (x.isClickable() && x.isEnabled()) return x.performAction(AccessibilityNodeInfo.ACTION_CLICK);
                      x = x.getParent();
                  }
                  return false;
              }

              @Override
              public void onInterrupt() { }
          }
