name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Project banao
        run: |
          mkdir -p app/src/main/java/com/rayyan/jarvis app/src/main/res/xml app/src/main/res/values
          cat > settings.gradle <<'JARVISEOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'Jarvis'
          include ':app'
          JARVISEOF
          cat > build.gradle <<'JARVISEOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          JARVISEOF
          cat > app/build.gradle <<'JARVISEOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.rayyan.jarvis'
              compileSdk 34
              defaultConfig { applicationId 'com.rayyan.jarvis'; minSdk 26; targetSdk 34; versionCode 20; versionName '2.9' }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          tasks.withType(JavaCompile) { options.encoding = 'UTF-8' }
          JARVISEOF
          cat > app/src/main/AndroidManifest.xml <<'JARVISEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.READ_CONTACTS"/>
              <uses-permission android:name="android.permission.CALL_PHONE"/>
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
              <uses-permission android:name="com.android.alarm.permission.SET_ALARM"/>
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <queries>
                  <intent><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent>
                  <package android:name="com.whatsapp.w4b"/>
                  <intent><action android:name="android.speech.RecognitionService"/></intent>
              </queries>
              <application android:label="Jarvis" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true" android:showWhenLocked="true" android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                      <intent-filter><action android:name="android.intent.action.ASSIST"/><category android:name="android.intent.category.DEFAULT"/></intent-filter>
                      <intent-filter><action android:name="android.intent.action.VOICE_COMMAND"/><category android:name="android.intent.category.DEFAULT"/></intent-filter>
                  </activity>
                  <service android:name=".JarvisService" android:permission="android.permission.BIND_VOICE_INTERACTION" android:exported="true">
                      <meta-data android:name="android.voice_interaction" android:resource="@xml/interaction_service"/>
                      <intent-filter><action android:name="android.service.voice.VoiceInteractionService"/></intent-filter>
                  </service>
                  <service android:name=".JarvisSessionService" android:permission="android.permission.BIND_VOICE_INTERACTION" android:exported="true"/>
                  <service android:name=".JarvisAccess" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE" android:exported="true">
                      <intent-filter><action android:name="android.accessibilityservice.AccessibilityService"/></intent-filter>
                      <meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility_service"/>
                  </service>
                  <provider android:name=".VoiceProvider" android:authorities="com.rayyan.jarvis.vfp" android:exported="false" android:grantUriPermissions="true"/>
              </application>
          </manifest>
          JARVISEOF
          cat > app/src/main/java/com/rayyan/jarvis/MainActivity.java <<'JARVISEOF'
          package com.rayyan.jarvis;

          import android.Manifest;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.ComponentName;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.database.Cursor;
          import android.hardware.camera2.CameraCharacteristics;
          import android.hardware.camera2.CameraManager;
          import android.media.AudioManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.AlarmClock;
          import android.provider.ContactsContract;
          import android.provider.MediaStore;
          import android.provider.Settings;
          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.webkit.JavascriptInterface;
          import android.webkit.JsPromptResult;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.EditText;
          import android.widget.Toast;
          import org.json.JSONObject;
          import java.net.URLEncoder;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends Activity {
              WebView w;
              SpeechRecognizer sr;
              SharedPreferences sp;
              AudioManager am;
              Handler hd = new Handler(Looper.getMainLooper());
              boolean muted = false;
              boolean pendingAssist = false;
              boolean pageReady = false;
              Runnable unmuteTask = () -> unmuteBeep();
          Runnable closeTask = () -> { destroySr(); finishAndRemoveTask(); };
          Runnable silenceTask = () -> { if (sr != null) { destroySr(); unmuteSoon(); sendErr(6); } };
              final int[] BEEP = {AudioManager.STREAM_MUSIC, AudioManager.STREAM_NOTIFICATION, AudioManager.STREAM_SYSTEM};

              final String[][] ALIAS = {
                  {"whatsapp|whatsappbusiness|whatsapp business|व्हाट्सएप|व्हाट्सऐप|वाट्सएप|वॉट्सऐप|واٹس ایپ|واٹساپ", "com.whatsapp.w4b", "com.whatsapp"},
                  {"instagram|insta|इंस्टाग्राम|انسٹاگرام", "com.instagram.android"},
                  {"tiktok|tik tok|टिकटॉक|ٹک ٹاک", "com.zhiliaoapp.musically", "com.ss.android.ugc.trill"},
                  {"youtube|यूट्यूब|یوٹیوب", "com.google.android.youtube"},
                  {"facebook|फेसबुक|فیس بک", "com.facebook.katana"},
                  {"chrome|क्रोम|کروم", "com.android.chrome"},
                  {"snapchat|स्नैपचैट", "com.snapchat.android"},
                  {"telegram|टेलीग्राम", "org.telegram.messenger"}
              };

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO, Manifest.permission.READ_CONTACTS, Manifest.permission.CALL_PHONE}, 1);
                  w = new WebView(this);
                  setContentView(w);
                  WebSettings s = w.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  w.addJavascriptInterface(new Br(), "Android");
                  w.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView v, String url) {
                          pageReady = true;
                          if (pendingAssist) { pendingAssist = false; assistJs(); }
                      }
                  });
                  w.setWebChromeClient(new WebChromeClient() {
                              @Override
                              public void onPermissionRequest(final PermissionRequest r) {
                                  runOnUiThread(() -> { try { r.grant(r.getResources()); } catch (Exception e) { } });
                              }

                      @Override
                      public boolean onJsPrompt(WebView v, String u, String m, String d, final JsPromptResult r) {
                          final EditText e = new EditText(MainActivity.this);
                          new AlertDialog.Builder(MainActivity.this).setMessage(m).setView(e).setCancelable(false)
                              .setPositiveButton("OK", (x, y) -> r.confirm(e.getText().toString()))
                              .setNegativeButton("Cancel", (x, y) -> r.cancel()).show();
                          return true;
                      }
                  });
                  sp = getSharedPreferences("j", 0);
                  pendingAssist = isAssist(getIntent());
                  String u = sp.getString("u", "");
                  if (u.isEmpty()) ask(); else w.loadUrl(u);
              }

              boolean isAssist(Intent i) {
                  if (i == null) return false;
                  String a = i.getAction();
                  return Intent.ACTION_ASSIST.equals(a) || Intent.ACTION_VOICE_COMMAND.equals(a) || i.getBooleanExtra("assist", false);
              }

              void assistJs() { js("if(window.onAssist){window.onAssist();}"); }

              @Override
              protected void onNewIntent(Intent i) {
                  super.onNewIntent(i);
                  setIntent(i);
                  if (isAssist(i)) { if (pageReady) assistJs(); else pendingAssist = true; }
              }

                  SpeechRecognizer mkGoogleSr() {
                      try {
                          if (getPackageManager().getLaunchIntentForPackage("com.google.android.googlequicksearchbox") != null) {
                              return SpeechRecognizer.createSpeechRecognizer(this, new ComponentName("com.google.android.googlequicksearchbox", "com.google.android.voicesearch.serviceapi.GoogleRecognitionService"));
                          }
                      } catch (Exception e) { }
                      return null;
                  }

                  void destroySr() {
                      hd.removeCallbacks(silenceTask);
                      SpeechRecognizer old = sr;
                      sr = null;
                      if (old != null) {
                          try { old.cancel(); } catch (Exception e) { }
                          try { old.destroy(); } catch (Exception e) { }
                      }
                  }

                  String errName(int e) {
                      switch (e) {
                          case 1: return "network timeout";
                          case 2: return "network";
                          case 3: return "audio";
                          case 4: return "server";
                          case 5: return "client";
                          case 6: return "kuch bola nahi";
                          case 7: return "samajh nahi aaya";
                          case 8: return "recognizer busy";
                          case 9: return "permission nahi";
                          case 10: return "bohat requests";
                          case 11: return "server disconnect";
                          case 12: return "language support nahi";
                          case 13: return "language available nahi";
                          default: return "code " + e;
                      }
                  }

                  void sendErr(int e) {
                      if (e == 6 || e == 7) js("window.onNative('')");
                      else js("if(window.onNativeError){window.onNativeError(" + e + ")}else{window.onNative('')}");
                  }

                  void startListen(final boolean google) {
                      destroySr();
                      SpeechRecognizer x = null;
                      try {
                          if (google) x = mkGoogleSr();
                          else if (SpeechRecognizer.isRecognitionAvailable(this)) x = SpeechRecognizer.createSpeechRecognizer(this);
                      } catch (Exception e) { x = null; }
                      if (x == null) {
                          if (google) { startListen(false); return; }
                          unmuteSoon();
                          toast("Mic masla: phone mein awaaz sunne wali service nahi mili");
                          sendErr(5);
                          return;
                      }
                      final SpeechRecognizer me = x;
                      sr = me;
                      me.setRecognitionListener(new RecognitionListener() {
                          public void onReadyForSpeech(android.os.Bundle p) { }
                          public void onBeginningOfSpeech() { if (me == sr) hd.removeCallbacks(silenceTask); }
                          public void onRmsChanged(float v) { }
                          public void onBufferReceived(byte[] p) { }
                          public void onEndOfSpeech() { }
                          public void onPartialResults(android.os.Bundle p) { }
                          public void onEvent(int t, android.os.Bundle p) { }
                          public void onError(final int e) {
                              if (me != sr) return;
                              hd.removeCallbacks(silenceTask);
                              if (google && e != 6 && e != 7 && e != 9) {
                                  hd.post(() -> startListen(false));
                                  return;
                              }
                              unmuteSoon();
                              if (e != 6 && e != 7) toast("Mic masla: " + errName(e));
                              sendErr(e);
                          }
                          public void onResults(android.os.Bundle r) {
                              if (me != sr) return;
                              hd.removeCallbacks(silenceTask);
                              unmuteSoon();
                              ArrayList<String> l = r.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                              org.json.JSONArray alts = new org.json.JSONArray();
                    if (l != null) { for (int k = 1; k < l.size() && k < 5; k++) alts.put(l.get(k)); }
                    js("window.onNative(" + JSONObject.quote(l == null || l.isEmpty() ? "" : l.get(0)) + "," + alts.toString() + ")");
                          }
                      });
                      Intent i = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                      i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                      i.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "hi-IN");
                      i.putExtra(RecognizerIntent.EXTRA_CALLING_PACKAGE, getPackageName());
                      i.putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, false);
                      i.putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 5);
                      hd.removeCallbacks(silenceTask);
                      hd.postDelayed(silenceTask, 5000);
                      try {
                          me.startListening(i);
                      } catch (Exception ex) {
                          if (google) hd.post(() -> startListen(false));
                          else { unmuteSoon(); toast("Mic masla: start nahi hua"); sendErr(5); }
                      }
                  }

              @Override
              protected void onPause() { super.onPause(); unmuteBeep(); }

              @Override
              protected void onStop() {
                  super.onStop();
                  destroySr();
                  unmuteBeep();
                  hd.removeCallbacks(closeTask);
                  hd.postDelayed(closeTask, 40000);
              }

              @Override
              protected void onStart() {
                  super.onStart();
                  hd.removeCallbacks(closeTask);
              }

              @Override
              protected void onDestroy() {
                  unmuteBeep();
                  if (sr != null) { try { sr.destroy(); } catch (Exception e) { } }
                  super.onDestroy();
              }

              void ask() {
                  final EditText e = new EditText(this);
                  e.setHint("jarvis site ka address");
                  new AlertDialog.Builder(this).setTitle("Jarvis site ka address").setView(e).setCancelable(false)
                      .setPositiveButton("OK", (x, y) -> {
                          String u = e.getText().toString().trim();
                          if (!u.startsWith("http")) u = "https://" + u;
                          sp.edit().putString("u", u).apply();
                          w.loadUrl(u);
                      }).show();
              }

              void muteBeep() {
                  if (am == null) am = (AudioManager) getSystemService(AUDIO_SERVICE);
                  if (!muted) {
                      for (int s : BEEP) { try { am.adjustStreamVolume(s, AudioManager.ADJUST_MUTE, 0); } catch (Exception e) { } }
                      muted = true;
                  }
                  hd.removeCallbacks(unmuteTask);
                  hd.postDelayed(unmuteTask, 12000);
              }

              void unmuteBeep() {
                  hd.removeCallbacks(unmuteTask);
                  if (!muted || am == null) return;
                  for (int s : BEEP) { try { am.adjustStreamVolume(s, AudioManager.ADJUST_UNMUTE, 0); } catch (Exception e) { } }
                  muted = false;
              }

              void unmuteSoon() {
                  hd.removeCallbacks(unmuteTask);
                  hd.postDelayed(unmuteTask, 400);
              }

              void js(final String code) { runOnUiThread(() -> w.evaluateJavascript(code, null)); }

              void go(Intent i) {
                  if (i == null) { toast("Nahi ho saka"); return; }
                  JarvisAccess.wake(this, 30000);
                  try { i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK); startActivity(i); } catch (Exception e) { toast("Nahi ho saka: " + e.getMessage()); }
              }

              void toast(final String t) { runOnUiThread(() -> Toast.makeText(this, t, Toast.LENGTH_LONG).show()); }

              String num(String name) {
                  String digits = name.replaceAll("[^0-9+]", "");
                  if (digits.length() >= 7) return digits;
                  try (Cursor c = getContentResolver().query(ContactsContract.CommonDataKinds.Phone.CONTENT_URI,
                          new String[]{ContactsContract.CommonDataKinds.Phone.NUMBER},
                          ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME + " LIKE ?", new String[]{"%" + name + "%"}, null)) {
                      if (c != null && c.moveToFirst()) return c.getString(0).replaceAll("[^0-9+]", "");
                  } catch (Exception e) { }
                  String fz = fuzzyNum(name);
              if (fz != null) return fz;
              toast("Contact nahi mila: " + name);
                  return null;
              }

              String vkey(String s) { return norm(s).replaceAll("[aeiouy]", ""); }

              String fuzzyNum(String name) {
                  String k = vkey(name);
                  if (k.length() < 2) return null;
                  try (Cursor c = getContentResolver().query(ContactsContract.CommonDataKinds.Phone.CONTENT_URI,
                          new String[]{ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME, ContactsContract.CommonDataKinds.Phone.NUMBER}, null, null, null)) {
                      String best = null;
                      int bs = 0;
                      while (c != null && c.moveToNext()) {
                          String dn = c.getString(0);
                          String ck = vkey(dn == null ? "" : dn);
                          int sc = 0;
                          if (ck.equals(k)) sc = 100;
                          else if (ck.length() >= 2 && (ck.contains(k) || k.contains(ck))) sc = 60;
                          if (sc > bs) { bs = sc; best = c.getString(1); }
                      }
                      if (best != null) return best.replaceAll("[^0-9+]", "");
                  } catch (Exception e) { }
                  return null;
              }

              String norm(String s) {
                  StringBuilder b = new StringBuilder();
                  for (char c : s.toLowerCase().toCharArray()) {
                      int t = Character.getType(c);
                      if (Character.isLetterOrDigit(c) || t == Character.NON_SPACING_MARK || t == Character.COMBINING_SPACING_MARK) b.append(c);
                  }
                  return b.toString();
              }

              String clean(String label) {
                  String[] stop = {"open", "kholo", "khol", "karo", "kro", "do", "app", "application", "please", "ko", "launch", "start", "chalao", "chala", "ओपन", "खोलो", "एप", "एप्लीकेशन", "ऐप", "करो"};
                  StringBuilder b = new StringBuilder();
                  for (String t : label.toLowerCase().trim().split("\\s+")) {
                      boolean skip = false;
                      for (String s : stop) if (t.equals(s)) skip = true;
                      if (!skip) b.append(t);
                  }
                  String r = norm(b.toString());
                  return r.isEmpty() ? norm(label) : r;
              }

              int dist(String a, String b) {
                  int[] p = new int[b.length() + 1];
                  for (int j = 0; j <= b.length(); j++) p[j] = j;
                  for (int i = 1; i <= a.length(); i++) {
                      int prev = p[0];
                      p[0] = i;
                      for (int j = 1; j <= b.length(); j++) {
                          int tmp = p[j];
                          p[j] = Math.min(Math.min(p[j] + 1, p[j - 1] + 1), prev + (a.charAt(i - 1) == b.charAt(j - 1) ? 0 : 1));
                          prev = tmp;
                      }
                  }
                  return p[b.length()];
              }

              boolean near(String a, String b) {
                  int m = Math.min(a.length(), b.length());
                  int max = m >= 6 ? 2 : (m >= 4 ? 1 : 0);
                  return max > 0 && dist(a, b) <= max;
              }

              boolean launch(String label) {
                  PackageManager pm = getPackageManager();
                  String t = clean(label);
                  if (t.isEmpty()) return false;

                  if (t.equals("camera") || t.equals("कैमरा") || t.equals("کیمرہ")) {
                      go(new Intent(MediaStore.INTENT_ACTION_STILL_IMAGE_CAMERA));
                      return true;
                  }
                  if (t.equals("settings") || t.equals("setting") || t.equals("सेटिंग") || t.equals("सेटिंग्स")) {
                      go(new Intent(Settings.ACTION_SETTINGS));
                      return true;
                  }

                  for (String[] row : ALIAS) {
                      boolean hit = false;
                      for (String n : row[0].split("\\|")) {
                          String nn = norm(n);
                          if (nn.isEmpty()) continue;
                          if (t.equals(nn) || (nn.length() >= 5 && t.contains(nn)) || near(t, nn)) { hit = true; break; }
                      }
                      if (!hit) continue;
                      for (int k = 1; k < row.length; k++) {
                          Intent li = pm.getLaunchIntentForPackage(row[k]);
                          if (li != null) { go(li); return true; }
                      }
                  }

                  Intent q = new Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER);
                  List<ResolveInfo> l = pm.queryIntentActivities(q, 0);
                  String bestPkg = null;
                  int best = 0;
                  for (ResolveInfo r : l) {
                      String lab = norm(r.loadLabel(pm).toString());
                      String pkg = r.activityInfo.packageName;
                      int sc = 0;
                      if (lab.equals(t)) sc = 100;
                      else if (lab.length() >= 3 && (lab.contains(t) || t.contains(lab))) sc = Math.max(50, 85 - Math.abs(lab.length() - t.length()));
                      else if (near(lab, t)) sc = 60;
                      else if (t.length() >= 4 && pkg.toLowerCase().contains(t)) sc = 40;
                      if (sc > best) { best = sc; bestPkg = pkg; }
                  }
                  if (bestPkg != null) {
                      Intent li = pm.getLaunchIntentForPackage(bestPkg);
                      if (li != null) { go(li); return true; }
                  }
                  return false;
              }

              String waPkg() {
                  for (String p : new String[]{"com.whatsapp.w4b", "com.whatsapp"}) {
                      if (getPackageManager().getLaunchIntentForPackage(p) != null) return p;
                  }
                  return null;
              }

              boolean isAccessOn() {
                  try {
                      String s = Settings.Secure.getString(getContentResolver(), Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES);
                      return s != null && s.contains("com.rayyan.jarvis");
                  } catch (Exception e) { return false; }
              }

              void waOpen(String name, String text, String mode) {
                  String n = num(name);
                  if (n == null) return;
                  n = n.replace("+", "");
                  if (n.startsWith("0")) n = "92" + n.substring(1);
                  String pk = waPkg();
                  if (pk == null) { toast("WhatsApp install nahi mili"); return; }
                  boolean on = isAccessOn();
                  if (!on && mode.equals("call")) {
                      toast("Pehle Accessibility mein Jarvis ko on karo");
                      JarvisAccess.voice = null;
                      go(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS));
                      return;
                  }
                  if (on) {
                      JarvisAccess.arm(mode);
                  } else {
                      toast("Accessibility on nahi hai, Send khud dabana hoga");
                      JarvisAccess.voice = null;
                  }
                  try {
                      String u = "https://wa.me/" + n;
                      if (mode.equals("send")) u += "?text=" + URLEncoder.encode(text, "UTF-8");
                      Intent i = new Intent(Intent.ACTION_VIEW, Uri.parse(u));
                      i.setPackage(pk);
                      go(i);
                  } catch (Exception e) { toast("WhatsApp nahi khuli"); }
              }
              class Br {
                          @JavascriptInterface public void listen() {
                              runOnUiThread(() -> {
                                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                                      requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, 1);
                                      toast("Mic ki permission Allow karo, phir dobara dabao");
                                      sendErr(9);
                                      return;
                                  }
                                  muteBeep();
                                  startListen(true);
                              });
                          }

                  @JavascriptInterface public void stopListen() {
                              runOnUiThread(() -> { destroySr(); unmuteSoon(); });
                          }

                          @JavascriptInterface public void torch(boolean on) {
                      try {
                          CameraManager cm = (CameraManager) getSystemService(CAMERA_SERVICE);
                          String id = null;
                          for (String c : cm.getCameraIdList()) {
                              Boolean f = cm.getCameraCharacteristics(c).get(CameraCharacteristics.FLASH_INFO_AVAILABLE);
                              if (f != null && f) { id = c; break; }
                          }
                          if (id == null) id = cm.getCameraIdList()[0];
                          cm.setTorchMode(id, on);
                      } catch (Exception e) { toast("Torch nahi chali"); }
                  }

                  @JavascriptInterface public void call(String name) {
                      String n = num(name);
                      if (n != null) { go(new Intent(Intent.ACTION_CALL, Uri.parse("tel:" + n))); JarvisAccess.sayVoice(1500); } else JarvisAccess.voice = null;
                  }

                  @JavascriptInterface public void whatsapp(String name, String text) {
                      String n = num(name);
                      if (n == null) return;
                      n = n.replace("+", "");
