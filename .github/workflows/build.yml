          package com.rayyan.jarvis;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.database.Cursor;
          import android.net.Uri;
          import android.provider.ContactsContract;
          import android.telephony.TelephonyManager;

          public class CallReceiver extends BroadcastReceiver {
              static boolean mine = false;
              static boolean answered = false;
              static String handled = "";

              static String norm(String s) {
                  if (s == null) return "";
                  return s.toLowerCase().replaceAll("[^a-z0-9\\u0900-\\u097f\\u0600-\\u06ff]", "").replaceAll("(.)\\1+", "$1");
              }

              static boolean allowed(Context c, String num, String names) {
                  String cn = "";
                  try {
                      Uri u = Uri.withAppendedPath(ContactsContract.PhoneLookup.CONTENT_FILTER_URI, Uri.encode(num));
                      Cursor cur = c.getContentResolver().query(u, new String[]{ContactsContract.PhoneLookup.DISPLAY_NAME}, null, null, null);
                      if (cur != null) {
                          if (cur.moveToFirst()) cn = norm(cur.getString(0));
                          cur.close();
                      }
                  } catch (Exception e) { }
                  if (cn.isEmpty()) return false;
                  for (String x : names.split("[,\\n\\u060c]")) {
                      String n = norm(x);
                      if (n.isEmpty()) continue;
                      if (cn.equals(n) || (n.length() >= 4 && cn.startsWith(n))) return true;
                  }
                  return false;
              }

              @Override
              public void onReceive(Context c, Intent i) {
                  if (!TelephonyManager.ACTION_PHONE_STATE_CHANGED.equals(i.getAction())) return;
                  String st = i.getStringExtra(TelephonyManager.EXTRA_STATE);
                  SharedPreferences sp = c.getSharedPreferences("jarvis_sec", 0);
                  if (TelephonyManager.EXTRA_STATE_IDLE.equals(st)) {
                      boolean was = mine;
                      mine = false; answered = false; handled = "";
                      if (was || JarvisAccess.secCall) JarvisAccess.endSecretary(c);
                      return;
                  }
                  if (!sp.getBoolean("on", false)) return;
                  String num = i.getStringExtra(TelephonyManager.EXTRA_INCOMING_NUMBER);
                  if (TelephonyManager.EXTRA_STATE_RINGING.equals(st)) {
                      if (num != null && !mine && !num.equals(handled)) {
                          handled = num;
                          if (allowed(c, num, sp.getString("names", ""))) {
                              mine = true;
                              JarvisAccess.armAnswer(c);
                          }
                      }
                  } else if (TelephonyManager.EXTRA_STATE_OFFHOOK.equals(st)) {
                      if (mine && !answered) {
                          answered = true;
                          JarvisAccess.onCallAnswered(c);
                      }
                  }
              }
          }
