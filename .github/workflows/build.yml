          package com.rayyan.jarvis;

          import android.content.Context;
          import android.security.keystore.KeyGenParameterSpec;
          import android.security.keystore.KeyProperties;
          import android.util.Base64;
          import java.security.KeyStore;
          import javax.crypto.Cipher;
          import javax.crypto.KeyGenerator;
          import javax.crypto.SecretKey;
          import javax.crypto.spec.GCMParameterSpec;

          public class UnlockStore {
              static final String ALIAS = "jarvis_unlock_key";

              static SecretKey key() throws Exception {
                  KeyStore ks = KeyStore.getInstance("AndroidKeyStore");
                  ks.load(null);
                  if (!ks.containsAlias(ALIAS)) {
                      KeyGenerator g = KeyGenerator.getInstance(KeyProperties.KEY_ALGORITHM_AES, "AndroidKeyStore");
                      g.init(new KeyGenParameterSpec.Builder(ALIAS, KeyProperties.PURPOSE_ENCRYPT | KeyProperties.PURPOSE_DECRYPT)
                          .setBlockModes(KeyProperties.BLOCK_MODE_GCM)
                          .setEncryptionPaddings(KeyProperties.ENCRYPTION_PADDING_NONE)
                          .setKeySize(256).build());
                      g.generateKey();
                  }
                  return (SecretKey) ks.getKey(ALIAS, null);
              }

              public static boolean save(Context c, String pin) {
                  try {
                      Cipher ci = Cipher.getInstance("AES/GCM/NoPadding");
                      ci.init(Cipher.ENCRYPT_MODE, key());
                      byte[] enc = ci.doFinal(pin.getBytes("UTF-8"));
                      c.getSharedPreferences("jarvis_u", 0).edit()
                          .putString("iv", Base64.encodeToString(ci.getIV(), Base64.NO_WRAP))
                          .putString("d", Base64.encodeToString(enc, Base64.NO_WRAP)).apply();
                      return true;
                  } catch (Exception e) { return false; }
              }

              public static String get(Context c) {
                  try {
                      String iv = c.getSharedPreferences("jarvis_u", 0).getString("iv", null);
                      String d = c.getSharedPreferences("jarvis_u", 0).getString("d", null);
                      if (iv == null || d == null) return null;
                      Cipher ci = Cipher.getInstance("AES/GCM/NoPadding");
                      ci.init(Cipher.DECRYPT_MODE, key(), new GCMParameterSpec(128, Base64.decode(iv, Base64.NO_WRAP)));
                      return new String(ci.doFinal(Base64.decode(d, Base64.NO_WRAP)), "UTF-8");
                  } catch (Exception e) { return null; }
              }
          }
