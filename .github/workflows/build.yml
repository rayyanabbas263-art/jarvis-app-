          package com.rayyan.jarvis;

          import java.io.ByteArrayOutputStream;
          import java.io.IOException;
          import java.io.OutputStream;
          import java.util.ArrayList;
          import java.util.List;

          public class OggOpus {
              static final int[] CRC = new int[256];
              static {
                  for (int i = 0; i < 256; i++) {
                      int r = i << 24;
                      for (int k = 0; k < 8; k++) r = ((r & 0x80000000) != 0) ? ((r << 1) ^ 0x04c11db7) : (r << 1);
                      CRC[i] = r;
                  }
              }

              static int crc(byte[] d) {
                  int c = 0;
                  for (int i = 0; i < d.length; i++) c = (c << 8) ^ CRC[((c >>> 24) & 0xff) ^ (d[i] & 0xff)];
                  return c;
              }

              static int samples(byte[] p) {
                  if (p.length < 1) return 0;
                  int toc = p[0] & 0xff;
                  int cfg = toc >> 3;
                  int fs;
                  if (cfg < 12) {
                      int[] a = {480, 960, 1920, 2880};
                      fs = a[cfg & 3];
                  } else if (cfg < 16) {
                      fs = ((cfg & 1) == 0) ? 480 : 960;
                  } else {
                      int[] a = {120, 240, 480, 960};
                      fs = a[cfg & 3];
                  }
                  int code = toc & 3;
                  int frames;
                  if (code == 0) frames = 1;
                  else if (code == 3) frames = (p.length > 1) ? (p[1] & 0x3f) : 1;
                  else frames = 2;
                  return fs * frames;
              }

              static void page(OutputStream o, int type, long gran, int serial, int seq, List<byte[]> pk) throws IOException {
                  ByteArrayOutputStream seg = new ByteArrayOutputStream();
                  ByteArrayOutputStream data = new ByteArrayOutputStream();
                  for (byte[] p : pk) {
                      int len = p.length;
                      while (len >= 255) { seg.write(255); len -= 255; }
                      seg.write(len);
                      data.write(p, 0, p.length);
                  }
                  byte[] sg = seg.toByteArray();
                  byte[] dt = data.toByteArray();
                  byte[] h = new byte[27 + sg.length + dt.length];
                  h[0] = 'O'; h[1] = 'g'; h[2] = 'g'; h[3] = 'S';
                  h[4] = 0;
                  h[5] = (byte) type;
                  for (int i = 0; i < 8; i++) h[6 + i] = (byte) (gran >>> (8 * i));
                  for (int i = 0; i < 4; i++) h[14 + i] = (byte) (serial >>> (8 * i));
                  for (int i = 0; i < 4; i++) h[18 + i] = (byte) (seq >>> (8 * i));
                  h[26] = (byte) sg.length;
                  System.arraycopy(sg, 0, h, 27, sg.length);
                  System.arraycopy(dt, 0, h, 27 + sg.length, dt.length);
                  int c = crc(h);
                  for (int i = 0; i < 4; i++) h[22 + i] = (byte) (c >>> (8 * i));
                  o.write(h);
              }

              public static void write(OutputStream o, List<byte[]> packets, int preSkip, int rate, long pcmSamples) throws IOException {
                  int serial = 0x4a525653;
                  int seq = 0;
                  byte[] head = new byte[19];
                  byte[] m = {'O', 'p', 'u', 's', 'H', 'e', 'a', 'd'};
                  System.arraycopy(m, 0, head, 0, 8);
                  head[8] = 1;
                  head[9] = 1;
                  head[10] = (byte) (preSkip & 0xff);
                  head[11] = (byte) ((preSkip >> 8) & 0xff);
                  for (int i = 0; i < 4; i++) head[12 + i] = (byte) (rate >>> (8 * i));
                  List<byte[]> one = new ArrayList<byte[]>();
                  one.add(head);
                  page(o, 2, 0L, serial, seq++, one);
                  byte[] vendor = {'J', 'a', 'r', 'v', 'i', 's'};
                  byte[] tags = new byte[8 + 4 + vendor.length + 4];
                  byte[] tm = {'O', 'p', 'u', 's', 'T', 'a', 'g', 's'};
                  System.arraycopy(tm, 0, tags, 0, 8);
                  tags[8] = (byte) vendor.length;
                  System.arraycopy(vendor, 0, tags, 12, vendor.length);
                  one = new ArrayList<byte[]>();
                  one.add(tags);
                  page(o, 0, 0L, serial, seq++, one);
                  long want = preSkip + pcmSamples * 48000L / rate;
                  long cum = 0;
                  long prev = 0;
                  List<byte[]> batch = new ArrayList<byte[]>();
                  for (int i = 0; i < packets.size(); i++) {
                      byte[] pk = packets.get(i);
                      cum += samples(pk);
                      batch.add(pk);
                      boolean last = (i == packets.size() - 1);
                      if (batch.size() >= 40 || last) {
                          long g = cum;
                          if (last) g = Math.max(prev, Math.min(cum, want));
                          page(o, last ? 4 : 0, g, serial, seq++, batch);
                          prev = g;
                          batch = new ArrayList<byte[]>();
                      }
                  }
              }
          }
