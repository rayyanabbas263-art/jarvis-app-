          package com.rayyan.jarvis;

          import android.media.MediaCodec;
          import android.media.MediaFormat;
          import android.media.MediaMuxer;
          import android.os.Build;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.nio.ByteBuffer;
          import java.nio.ByteOrder;
          import java.util.ArrayList;
          import java.util.List;

          public class VoiceNote {
              public static String mime = "audio/ogg";

              public static File make(File dir, byte[] pcm, int rate) {
                  try {
                      File[] old = dir.listFiles();
                      if (old != null) {
                          for (File o : old) { if (o.getName().startsWith("jarvis_voice")) o.delete(); }
                      }
                  } catch (Exception e) { }
                  long id = System.currentTimeMillis();
                  try {
                      if (rate != 8000 && rate != 12000 && rate != 16000 && rate != 24000 && rate != 48000) {
                          pcm = resample(pcm, rate, 24000);
                          rate = 24000;
                      }
                      if (Build.VERSION.SDK_INT >= 29) {
                          File f = new File(dir, "jarvis_voice_" + id + ".opus");
                          if (encodeOpus(f, pcm, rate)) { mime = "audio/ogg"; return f; }
                      }
                  } catch (Throwable t) { }
                  try {
                      File f = new File(dir, "jarvis_voice_" + id + ".m4a");
                      if (encodeAac(f, pcm, rate)) { mime = "audio/mp4"; return f; }
                  } catch (Throwable t) { }
                  return null;
              }

              static boolean encodeOpus(File out, byte[] pcm, int rate) throws Exception {
                  MediaFormat f = MediaFormat.createAudioFormat("audio/opus", rate, 1);
                  f.setInteger(MediaFormat.KEY_BIT_RATE, 24000);
                  f.setInteger(MediaFormat.KEY_MAX_INPUT_SIZE, 16384);
                  MediaCodec c = MediaCodec.createEncoderByType("audio/opus");
                  List<byte[]> packets = new ArrayList<byte[]>();
                  int preSkip = 312;
                  try {
                      c.configure(f, null, null, MediaCodec.CONFIGURE_FLAG_ENCODE);
                      c.start();
                      MediaCodec.BufferInfo info = new MediaCodec.BufferInfo();
                      int pos = 0;
                      boolean inDone = false;
                      boolean outDone = false;
                      for (int guard = 0; !outDone && guard < 40000; guard++) {
                          if (!inDone) {
                              int ib = c.dequeueInputBuffer(10000);
                              if (ib >= 0) {
                                  ByteBuffer buf = c.getInputBuffer(ib);
                                  buf.clear();
                                  int n = Math.min(buf.remaining(), pcm.length - pos);
                                  n = n & ~1;
                                  long ts = (long) (pos / 2) * 1000000L / rate;
                                  if (n <= 0) {
                                      c.queueInputBuffer(ib, 0, 0, ts, MediaCodec.BUFFER_FLAG_END_OF_STREAM);
                                      inDone = true;
                                  } else {
                                      buf.put(pcm, pos, n);
                                      c.queueInputBuffer(ib, 0, n, ts, 0);
                                      pos += n;
                                  }
                              }
                          }
                          int ob = c.dequeueOutputBuffer(info, 10000);
                          if (ob == MediaCodec.INFO_OUTPUT_FORMAT_CHANGED) {
                              try {
                                  ByteBuffer b = c.getOutputFormat().getByteBuffer("csd-1");
                                  if (b != null && b.remaining() >= 8) {
                                      ByteBuffer d = b.duplicate();
                                      d.order(ByteOrder.LITTLE_ENDIAN);
                                      long ns = d.getLong(d.position());
                                      int ps = (int) (ns * 48000L / 1000000000L);
                                      if (ps > 0 && ps < 4000) preSkip = ps;
                                  }
                              } catch (Exception e) { }
                          } else if (ob >= 0) {
                              ByteBuffer o = c.getOutputBuffer(ob);
                              boolean cfg = (info.flags & MediaCodec.BUFFER_FLAG_CODEC_CONFIG) != 0;
                              if (!cfg && info.size > 0) {
                                  byte[] pk = new byte[info.size];
                                  o.position(info.offset);
                                  o.limit(info.offset + info.size);
                                  o.get(pk);
                                  packets.add(pk);
                              }
                              c.releaseOutputBuffer(ob, false);
                              if ((info.flags & MediaCodec.BUFFER_FLAG_END_OF_STREAM) != 0) outDone = true;
                          }
                      }
                      if (!outDone || packets.isEmpty()) return false;
                  } finally {
                      try { c.stop(); } catch (Exception e) { }
                      try { c.release(); } catch (Exception e) { }
                  }
                  FileOutputStream fo = new FileOutputStream(out);
                  try {
                      OggOpus.write(fo, packets, preSkip, rate, pcm.length / 2);
                  } finally {
                      fo.close();
                  }
                  return out.length() > 0;
              }

              static boolean encodeAac(File out, byte[] pcm, int rate) throws Exception {
                  MediaFormat f = MediaFormat.createAudioFormat("audio/mp4a-latm", rate, 1);
                  f.setInteger(MediaFormat.KEY_BIT_RATE, 48000);
                  f.setInteger(MediaFormat.KEY_AAC_PROFILE, 2);
                  f.setInteger(MediaFormat.KEY_MAX_INPUT_SIZE, 16384);
                  if (out.exists()) out.delete();
                  MediaCodec c = MediaCodec.createEncoderByType("audio/mp4a-latm");
                  MediaMuxer m = null;
                  boolean started = false;
                  try {
                      c.configure(f, null, null, MediaCodec.CONFIGURE_FLAG_ENCODE);
                      c.start();
                      m = new MediaMuxer(out.getAbsolutePath(), 0);
                      int track = -1;
                      MediaCodec.BufferInfo info = new MediaCodec.BufferInfo();
                      int pos = 0;
                      boolean inDone = false;
                      boolean outDone = false;
                      for (int guard = 0; !outDone && guard < 40000; guard++) {
                          if (!inDone) {
                              int ib = c.dequeueInputBuffer(10000);
                              if (ib >= 0) {
                                  ByteBuffer buf = c.getInputBuffer(ib);
                                  buf.clear();
                                  int n = Math.min(buf.remaining(), pcm.length - pos);
                                  n = n & ~1;
                                  long ts = (long) (pos / 2) * 1000000L / rate;
                                  if (n <= 0) {
                                      c.queueInputBuffer(ib, 0, 0, ts, MediaCodec.BUFFER_FLAG_END_OF_STREAM);
                                      inDone = true;
                                  } else {
                                      buf.put(pcm, pos, n);
                                      c.queueInputBuffer(ib, 0, n, ts, 0);
                                      pos += n;
                                  }
                              }
                          }
                          int ob = c.dequeueOutputBuffer(info, 10000);
                          if (ob == MediaCodec.INFO_OUTPUT_FORMAT_CHANGED) {
                              track = m.addTrack(c.getOutputFormat());
                              m.start();
                              started = true;
                          } else if (ob >= 0) {
                              ByteBuffer o = c.getOutputBuffer(ob);
                              if ((info.flags & MediaCodec.BUFFER_FLAG_CODEC_CONFIG) != 0) info.size = 0;
                              if (info.size > 0 && started) {
                                  o.position(info.offset);
                                  o.limit(info.offset + info.size);
                                  m.writeSampleData(track, o, info);
                              }
                              c.releaseOutputBuffer(ob, false);
                              if ((info.flags & MediaCodec.BUFFER_FLAG_END_OF_STREAM) != 0) outDone = true;
                          }
                      }
                      return started && outDone && out.length() > 0;
                  } finally {
                      try { c.stop(); } catch (Exception e) { }
                      try { c.release(); } catch (Exception e) { }
                      if (m != null) {
                          try { if (started) m.stop(); } catch (Exception e) { }
                          try { m.release(); } catch (Exception e) { }
                      }
                  }
              }

              static byte[] resample(byte[] in, int from, int to) {
                  int n = in.length / 2;
                  short[] s = new short[n];
                  for (int i = 0; i < n; i++) s[i] = (short) ((in[2 * i] & 0xff) | (in[2 * i + 1] << 8));
                  int m = (int) ((long) n * to / from);
                  byte[] out = new byte[m * 2];
                  for (int i = 0; i < m; i++) {
                      double p = (double) i * from / to;
                      int a = (int) p;
                      int b = Math.min(a + 1, n - 1);
                      double fr = p - a;
                      short v = (short) (s[a] * (1 - fr) + s[b] * fr);
                      out[2 * i] = (byte) (v & 0xff);
                      out[2 * i + 1] = (byte) ((v >> 8) & 0xff);
                  }
                  return out;
              }
          }
