                      ci.init(Cipher.ENCRYPT_MODE, key());
                      byte[] enc = ci.doFinal(pin.getBytes("UTF-8"));
                      c.getSharedPreferences("jarvis_u", 0).edit()
                          .putString("iv", Base64.encodeToString(ci.getIV(), Base64.NO_WRAP))
                          .putString("d", Base64.encodeToString(enc, Base64.NO_WRAP)).apply();
                      return true;
                  } catch (Exception e) { return false; }
              }

              public static String get(Context c) {
                  try {
                      String iv = c.getSharedPreferences("jarvis_u", 0).getString("iv", null);
                      String d = c.getSharedPreferences("jarvis_u", 0).getString("d", null);
                      if (iv == null || d == null) return null;
                      Cipher ci = Cipher.getInstance("AES/GCM/NoPadding");
                      ci.init(Cipher.DECRYPT_MODE, key(), new GCMParameterSpec(128, Base64.decode(iv, Base64.NO_WRAP)));
                      return new String(ci.doFinal(Base64.decode(d, Base64.NO_WRAP)), "UTF-8");
                  } catch (Exception e) { return null; }
              }
          }
