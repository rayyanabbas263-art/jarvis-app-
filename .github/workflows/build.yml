          package com.rayyan.jarvis;

          import android.content.ContentProvider;
          import android.content.ContentValues;
          import android.database.Cursor;
          import android.database.MatrixCursor;
          import android.net.Uri;
          import android.os.ParcelFileDescriptor;
          import android.provider.OpenableColumns;
          import java.io.File;
          import java.io.FileNotFoundException;

          public class VoiceProvider extends ContentProvider {
              @Override
              public boolean onCreate() { return true; }

              File file(Uri u) {
                  String n = u.getLastPathSegment();
                  if (n == null || n.contains("/") || n.contains("..")) return null;
                  File f = new File(getContext().getCacheDir(), n);
                  return f.exists() ? f : null;
              }

              @Override
              public Cursor query(Uri u, String[] proj, String sel, String[] args, String sort) {
                  File f = file(u);
                  if (f == null) return null;
                  MatrixCursor c = new MatrixCursor(new String[]{OpenableColumns.DISPLAY_NAME, OpenableColumns.SIZE});
                  c.addRow(new Object[]{f.getName(), Long.valueOf(f.length())});
                  return c;
              }

              @Override
              public String getType(Uri u) {
                  File f = file(u);
                  return (f != null && f.getName().endsWith(".m4a")) ? "audio/mp4" : "audio/ogg";
              }

              @Override
              public ParcelFileDescriptor openFile(Uri u, String mode) throws FileNotFoundException {
                  File f = file(u);
                  if (f == null) throw new FileNotFoundException();
                  return ParcelFileDescriptor.open(f, ParcelFileDescriptor.MODE_READ_ONLY);
              }

              @Override
              public Uri insert(Uri u, ContentValues v) { return null; }

              @Override
              public int delete(Uri u, String s, String[] a) { return 0; }

              @Override
              public int update(Uri u, ContentValues v, String s, String[] a) { return 0; }
          }
